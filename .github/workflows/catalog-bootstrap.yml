name: Catalog package bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  copy-packages:
    if: github.head_ref == 'catalog-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Copy launcher packages from legacy catalog branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog-packages
          base='https://raw.githubusercontent.com/GenomiskDiagnostik/share-with-g2/g2-launcher-catalog/catalog-packages'
          for name in send-to-g2 mr-know-it-all ar-weather-bearing stereo-model-viewer trafik-hud r1-ring-writer; do
            curl --fail --location --retry 3 "$base/$name.zip" -o "catalog-packages/$name.zip"
          done

      - name: Verify package checksums and sizes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/catalog.sha256 <<'CHECKSUMS'
          b52ce9fc605c46f299b818f58fb8134adc0f65a49e93f0061156409b4adf3d71  catalog-packages/send-to-g2.zip
          a4b6a69a2f2584f56d5f98f7a44af020673b6c2129f539a1a737ac36e75d9a5a  catalog-packages/mr-know-it-all.zip
          7a32d84386cf24dc07d854eb42a5e5808bc20dc237bcbf60dad05b6a8a9c2713  catalog-packages/ar-weather-bearing.zip
          e8f1a6383f63540ca1bced211a38878983354fd26fb24b4b37352f09511f5b7e  catalog-packages/stereo-model-viewer.zip
          ce36bfab782a4180cc24eb7041be62b8f4cba06aafba9fc2b6a423311220fea0  catalog-packages/trafik-hud.zip
          3e3b5ef1a40d52ce31813f84563ba98d87319dd8f67aef43102f2ceba4577899  catalog-packages/r1-ring-writer.zip
          CHECKSUMS
          sha256sum --check /tmp/catalog.sha256
          test "$(stat -c %s catalog-packages/send-to-g2.zip)" = 62151
          test "$(stat -c %s catalog-packages/mr-know-it-all.zip)" = 54378
          test "$(stat -c %s catalog-packages/ar-weather-bearing.zip)" = 43095
          test "$(stat -c %s catalog-packages/stereo-model-viewer.zip)" = 58802
          test "$(stat -c %s catalog-packages/trafik-hud.zip)" = 42788
          test "$(stat -c %s catalog-packages/r1-ring-writer.zip)" = 37424

      - name: Commit packages and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/catalog-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish launcher catalog packages'
          git push origin HEAD:${{ github.head_ref }}
